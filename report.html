<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقارير - منظومة إدارة المخازن | كلية التقنية الصناعية</title>
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/print.css">
</head>
<body>

    <!-- Main Content -->
    <main class="content">
        <div class="header-title-section">
            <h1>التقارير</h1>
            <p class="subtitle">إعداد وطباعة تقارير المخزون والحركات</p>
        </div>
        <div class="page-content">
            <!-- Report Filters Panel -->
            <div class="panel no-print" style="margin-bottom: 20px;">
                <div class="panel-body">
                    <form class="form-grid" style="display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 0;" onsubmit="event.preventDefault(); generateReport();">
                        <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                            <label>نوع التقرير</label>
                            <select class="filter-select" id="reportType" onchange="onReportTypeChange()" style="width: 100%;">
                                <option value="stock">تقرير حالة المخزون</option>
                                <option value="items_base">دليل الأصناف الأساسي</option>
                                <option value="lowstock">تقرير الأصناف منخفضة الرصيد</option>
                                <option value="inventory_count">تقرير الجرد الفعلي</option>
                                <option value="movements_log">سجل حركات التوريد والصرف</option>
                                <option value="supply_receipt">إذن توريد</option>
                                <option value="dispense_receipt">إذن صرف</option>
                                <option value="item_card">بطاقة حركة صنف</option>
                                <option value="suppliers">دليل الموردين والجهات</option>
                            </select>
                        </div>
                        <div class="form-group" id="dateFromGroup" style="min-width: 160px; margin-bottom: 0;">
                            <label>من تاريخ</label>
                            <input type="date" id="dateFrom" class="filter-select" style="min-width: 160px;" max="">
                        </div>
                        <div class="form-group" id="dateToGroup" style="min-width: 160px; margin-bottom: 0;">
                            <label>إلى تاريخ</label>
                            <input type="date" id="dateTo" class="filter-select" style="min-width: 160px;" max="">
                        </div>
                        <div class="form-group" id="itemSelectGroup" style="flex: 1; min-width: 200px; margin-bottom: 0; display: none;">
                            <label>الصنف (لبطاقة الحركة)</label>
                            <select class="filter-select" id="itemSelect" style="width: 100%;">
                                <option value="">اختر صنفاً</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-secondary" onclick="openColumnsModal()" title="اختيار الأعمدة الظاهرة في التقرير">
                            <i class="fas fa-columns"></i>
                            <span>الأعمدة</span>
                        </button>
                        <button type="button" class="btn btn-primary" id="printReportBtn" onclick="printReport()">
                            <i class="fas fa-print"></i>
                            <span>طباعة التقرير</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Summary Stats -->
            <div class="stats-grid" id="reportStats" style="grid-template-columns: repeat(3, 1fr);">
                <div class="stat-card">
                    <div class="stat-content">
                        <div class="stat-label">اسم التقرير</div>
                        <div class="stat-value" id="reportName" style="font-size: 18px;">تقرير حالة المخزون</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content">
                        <div class="stat-label">عدد السجلات</div>
                        <div class="stat-value" id="recordCount">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-content">
                        <div class="stat-label">إجمالي القيمة</div>
                        <div class="stat-value" id="totalValue">0 د.ل</div>
                    </div>
                </div>
            </div>

            <!-- Report Table -->
            <div class="table-container" style="margin-top: 20px;">
                <div class="table-toolbar">
                    <div class="table-title" id="reportTableTitle">تقرير حالة المخزون</div>
                    <div class="table-meta" id="reportTableMeta">جميع الأصناف مع الرصيد الحالي والقيمة</div>
                </div>

                <div style="overflow-x: auto;">
                    <table id="reportTable">
                        <thead id="reportTableHead">
                            <tr>
                                <th class="sortable" data-column="item_id" onclick="sortTable('reportTable', 0)">رقم الصنف <span class="sort-icon">↕</span></th>
                                <th class="sortable" data-column="item_name" onclick="sortTable('reportTable', 1)">اسم الصنف <span class="sort-icon">↕</span></th>
                                <th class="sortable" data-column="category" onclick="sortTable('reportTable', 2)">التصنيف <span class="sort-icon">↕</span></th>
                                <th class="sortable" data-column="unit" onclick="sortTable('reportTable', 3)">الوحدة <span class="sort-icon">↕</span></th>
                                <th class="sortable" data-column="quantity" onclick="sortTable('reportTable', 4)">الرصيد <span class="sort-icon">↕</span></th>
                                <th class="sortable" data-column="min_qty" onclick="sortTable('reportTable', 5)">الحد الأدنى <span class="sort-icon">↕</span></th>
                                <th class="sortable" data-column="price" onclick="sortTable('reportTable', 6)">سعر الوحدة <span class="sort-icon">↕</span></th>
                                <th class="sortable" data-column="value" onclick="sortTable('reportTable', 7)">القيمة <span class="sort-icon">↕</span></th>
                                <th class="sortable" data-column="status" onclick="sortTable('reportTable', 8)">الحالة <span class="sort-icon">↕</span></th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <tr><td colspan="9" style="text-align: center; padding: 40px;">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Print Signatures -->
            <div id="printSignaturesContainer"></div>
        </div>
    </main>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/components/sidebar.js"></script>
    <script src="assets/js/components/header.js"></script>
    <script src="assets/js/components/printLayout.js"></script>
    <script src="assets/js/components/printSignatures.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/report.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            PrintSignatures.render('#printSignaturesContainer', ['المستلم', 'أمين المخزن', 'المدير']);
        });
    </script>
</body>
</html>
