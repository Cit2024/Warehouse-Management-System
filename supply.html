<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>إذن توريد - منظومة إدارة المخازن | كلية التقنية الصناعية</title>
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/print.css">
</head>
<body>

    <!-- Main Content -->
    <main class="content">

        <!-- Page Title -->
        <div class="header-title-section">
            <h1>إضافة إذن توريد جديد</h1>
            <p class="subtitle">استلام بضاعة من مورد</p>
        </div>

        <div class="page-content">
            <div class="panel">
                <div class="panel-body">
                    <form onsubmit="event.preventDefault(); saveReceipt();">
                        <!-- Document Header -->
                        <div class="form-grid">
                            <div id="rem2" class="form-group">
                                <label for="receiptDate">تاريخ التوريد</label>
                                <input type="date" id="receiptDate" required max="">
                            </div>
                            <div class="form-group">
                                <label for="supplierSelect">المورد</label>
                                <select id="supplierSelect" required>
                                    <option value="">-- اختر المورد --</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="storeSelect">المخزن المستلم</label>
                                <select id="storeSelect" required>
                                    <option value="">-- اختر المخزن --</option>
                                </select>
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label for="receiptNotes">ملاحظات</label>
                                <input type="text" id="receiptNotes" placeholder="أي ملاحظات إضافية...">
                            </div>
                        </div>

                        <!-- Items Section -->
                        <div class="items-section" style="margin-top: 30px; border-top: 2px dashed var(--border-color); padding-top: 20px;">
                            <h3 style="margin-bottom: 20px; color: var(--primary); font-size: 16px;">الأصناف الموردة</h3>

                            <div id="itemsSel" style="display: flex; gap: 12px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap;">
                                <div class="form-group" style="flex: 2; min-width: 200px; margin-bottom: 0;">
                                    <label for="itemSelect">الصنف</label>
                                    <select id="itemSelect">
                                        <option value="">-- اختر صنفاً لإضافته --</option>
                                    </select>
                                </div>
                                <div class="form-group" style="flex: 1; min-width: 100px; margin-bottom: 0;">
                                    <label for="itemQty">الكمية</label>
                                    <input type="number" id="itemQty" placeholder="الكمية" min="1">
                                </div>
                                <div class="form-group" style="flex: 1; min-width: 100px; margin-bottom: 0;">
                                    <label for="itemPrice">سعر الوحدة</label>
                                    <input type="number" id="itemPrice" placeholder="السعر" min="0" step="0.01">
                                </div>
                                <button type="button" class="btn btn-primary" onclick="addRow()">
                                    <span><i class="fas fa-plus"></i></span>
                                    <span>إضافة</span>
                                </button>
                            </div>

                            <div class="print-section-title print-only">الأصناف الموردة</div>

                            <div class="table-container" style="margin-bottom: 20px;">
                                <table id="receiptTable">
                                    <thead>
                                        <tr>
                                            <th>رقم الصنف</th>
                                            <th>اسم الصنف</th>
                                            <th>الكمية</th>
                                            <th>سعر الوحدة</th>
                                            <th>الإجمالي</th>
                                            <th>إجراء</th>
                                        </tr>
                                    </thead>
                                    <tbody id="receiptTableBody">
                                        <tr>
                                            <td colspan="6" style="text-align: center; padding: 32px; color: var(--text-muted);">
                                                لم تتم إضافة أصناف بعد
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="print-grand-total print-only">
                                <span class="total-label">إجمالي قيمة الفاتورة:</span>
                                <span class="total-value"><span id="grandTotal">0.00</span> د.ل</span>
                            </div>
                            <div class="screen-only" style="text-align: center; font-size: 18px; font-weight: 700; color: var(--primary); padding: 16px; background: var(--primary-light); border-radius: 12px;">
                                إجمالي قيمة الفاتورة: <span id="grandTotalScreen">0.00</span> د.ل
                            </div>
                        </div>

                        <div style="display: flex; gap: 12px; margin-top: 24px;">
                            <button type="submit" class="btn btn-success btn-lg" style="flex: 1;">
                                <span><i class="fas fa-save"></i></span>
                                <span>حفظ إذن التوريد</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Signatures (Print Only) -->
            <div id="printSignaturesContainer"></div>
        </div>
    </main>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/components/sidebar.js"></script>
    <script src="assets/js/components/header.js"></script>
    <script src="assets/js/components/printLayout.js"></script>
    <script src="assets/js/components/printModal.js"></script>
    <script src="assets/js/components/printSignatures.js"></script>
    <script src="assets/js/components/printReport.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/supply.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            PrintSignatures.render('#printSignaturesContainer', ['المستلم', 'أمين المخزن', 'المدير']);
        });
    </script>
</body>
</html>
