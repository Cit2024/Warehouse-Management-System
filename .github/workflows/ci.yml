name: CI — Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch (keeps the latest only)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # required to upload release assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
            asset_name: windows-installer.exe
            ext: .exe
          - os: ubuntu-latest
            build_script: build:linux
            asset_name: linux-appimage.AppImage
            ext: .AppImage
          - os: ubuntu-latest
            build_script: build:linux-deb
            asset_name: linux-debian.deb
            ext: .deb

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.os }} (${{ matrix.build_script }})

    steps:
      # ——— 1. Checkout source ———
      - name: Checkout repository
        uses: actions/checkout@v4

      # ——— 2. Setup Bun ———
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # ——— 3. Setup Node.js 22 ———
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ——— 4. Install Linux packaging deps ———
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libkrb5-dev libsecret-1-dev fakeroot dpkg

      # ——— 5. Install dependencies ———
      - name: Install dependencies
        run: bun install

      # ——— 6. Rebuild native addons for Electron ———
      - name: Rebuild native addons (better-sqlite3)
        run: bun run postinstall

      # ——— 7. Build the application ———
      - name: Build application
        run: bun run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ——— 8. Stage installer with stable name ———
      - name: Stage installer
        shell: bash
        run: |
          mkdir -p release-assets
          cp release/*${{ matrix.ext }} "release-assets/${{ matrix.asset_name }}"

      # ——— 9. Publish to continuous release (main branch only) ———
      - name: Upload to continuous release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view continuous --repo "${{ github.repository }}" > /dev/null 2>&1 || \
            gh release create continuous \
              --repo "${{ github.repository }}" \
              --title "Continuous Build" \
              --notes "Latest installers from the main branch." \
              --prerelease
          gh release upload continuous \
            --repo "${{ github.repository }}" \
            release-assets/* \
            --clobber
