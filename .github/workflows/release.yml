name: Release — Build & Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
            artifact_path: dist/*.exe
          - os: ubuntu-latest
            build_script: build:linux
            artifact_path: dist/*.AppImage
          - os: ubuntu-latest
            build_script: build:deb
            artifact_path: dist/*.deb

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native addons (better-sqlite3)
        run: npx @electron/rebuild

      - name: Build application
        run: npm run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload directly to the GitHub Release instead of using Actions artifacts,
      # so the workflow is not blocked by the Actions artifact storage quota.
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          name: "منظومة المخازن ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
