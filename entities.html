<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الجهات والموردين - منظومة إدارة المخازن | كلية التقنية الصناعية</title>
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/print.css">
</head>
<body>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="content">

        <!-- Page Title -->
        <div class="header-title-section">
            <h1>إدارة الجهات والموردين</h1>
            <p class="subtitle">قائمة الموردين والجهات الطالبة والأقسام</p>
        </div>

        <div class="page-content">
            <!-- Toolbar -->
            <div class="toolbar">
                <button class="btn btn-primary" onclick="openModal()">
                    <span><i class="fas fa-plus"></i></span>
                    <span>إضافة جهة جديدة</span>
                </button>
                <div class="toolbar-search">
                    <span class="toolbar-search-icon"><i class="fas fa-search"></i></span>
                    <input type="text" id="entitySearch" placeholder="بحث بالاسم أو رقم الهاتف..." oninput="filterEntities()">
                </div>
                <div style="display: flex; gap: 10px;">
                    <!-- FIXED: Use printEntities() instead of handleDirectPrint() -->
                    <button class="btn btn-secondary" onclick="printEntities()">
                        <span><i class="fas fa-print"></i></span>
                        <span>طباعة</span>
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <div class="table-toolbar">
                    <div class="table-title">قائمة الجهات</div>
                    <div class="table-meta" id="entitiesCount">0 جهة مسجلة</div>
                </div>
                <div style="overflow-x: auto;">
                    <table id="entitiesTable">
                        <thead>
                            <tr>
                                <th class="sortable" onclick="sortTable('entitiesTable', 0)">رقم الجهة <span class="sort-icon">↕</span></th>
                                <th class="sortable" onclick="sortTable('entitiesTable', 1)">اسم الجهة <span class="sort-icon">↕</span></th>
                                <th class="sortable" onclick="sortTable('entitiesTable', 2)">التصنيف <span class="sort-icon">↕</span></th>
                                <th class="sortable" onclick="sortTable('entitiesTable', 3)">رقم الهاتف <span class="sort-icon">↕</span></th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="entitiesTableBody">
                            <tr><td colspan="5" style="text-align: center; padding: 40px;">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Print Signatures (fixed at page bottom) -->
        <div id="printSignaturesContainer"></div>
    </main>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/components/sidebar.js"></script>
    <script src="assets/js/components/header.js"></script>
    <script src="assets/js/components/printLayout.js"></script>
    <script src="assets/js/components/addEntityModal.js"></script>
    <script src="assets/js/components/printSignatures.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/entities.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            PrintSignatures.render('#printSignaturesContainer', ['المستلم', 'أمين المخزن', 'المدير']);
        });
    </script>
</body>
</html>
