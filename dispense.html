<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>إذن صرف - منظومة إدارة المخازن | كلية التقنية الصناعية</title>
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/print.css">
</head>
<body>

    <!-- Main Content -->
    <main class="content">

        <!-- Page Title -->
        <div class="header-title-section">
            <h1>إضافة إذن صرف جديد</h1>
            <p class="subtitle">تسليم بضاعة لجهة طالبة</p>
        </div>

        <div class="page-content">
            <div class="panel">
                <div class="panel-body">
                    <form class="form-grid" onsubmit="event.preventDefault(); saveReceipt();">
                        <!-- Document Header -->
                        <div id="rem2" class="form-group">
                            <label for="receiptDate">تاريخ الصرف</label>
                            <input type="date" id="receiptDate" required max="">
                        </div>
                        <div class="form-group">
                            <label for="requesterSelect">الجهة الطالبة (القسم/الموظف)</label>
                            <select id="requesterSelect" required>
                                <option value="">-- اختر الجهة --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="storeSelect">المخزن المصروف منه</label>
                            <select id="storeSelect" required>
                                <option value="">-- اختر المخزن --</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label for="receiptNotes">ملاحظات / سبب الصرف</label>
                            <input type="text" id="receiptNotes" placeholder="مثال: عهدة شخصية، احتياج معمل...">
                        </div>

                        <!-- Items Section -->
                        <div class="items-section" style="grid-column: 1 / -1; margin-top: 30px; border-top: 2px dashed var(--border-default); padding-top: 20px;">
                            <h3 style="margin-bottom: 20px; color: var(--primary); font-size: 16px;">الأصناف المصروفة</h3>

                            <div id="itemsSel" style="display: flex; gap: 12px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap;">
                                <div class="form-group" style="flex: 2; min-width: 200px; margin-bottom: 0;">
                                    <label for="itemSelect">الصنف</label>
                                    <select id="itemSelect" onchange="updateStockBadge()">
                                        <option value="">-- اختر الصنف --</option>
                                    </select>
                                </div>
                                <div class="stock-badge" id="stockBadge" style="margin-bottom: 8px;">المتاح: 0</div>
                                <div class="form-group" style="flex: 1; min-width: 100px; margin-bottom: 0;">
                                    <label for="itemQty">الكمية المطلوبة</label>
                                    <input type="number" id="itemQty" placeholder="الكمية" min="1">
                                </div>
                                <button type="button" class="btn btn-primary" onclick="addRow()">
                                    <i class="fas fa-plus"></i>
                                    <span>إضافة</span>
                                </button>
                            </div>

                            <div class="print-section-title print-only">الأصناف المصروفة</div>

                            <div class="table-container" style="margin-bottom: 20px;">
                                <table id="receiptTable">
                                    <thead>
                                        <tr>
                                            <th>رقم الصنف</th>
                                            <th>اسم الصنف</th>
                                            <th>الكمية المصروفة</th>
                                            <th>إجراء</th>
                                        </tr>
                                    </thead>
                                    <tbody id="receiptTableBody">
                                        <tr>
                                            <td colspan="4" style="text-align: center; padding: 32px; color: var(--text-muted);">
                                                لم تتم إضافة أصناف بعد
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div style="grid-column: 1 / -1; display: flex; gap: 12px; margin-top: 24px;">
                            <button type="submit" class="btn btn-success btn-lg" style="flex: 1;">
                                <i class="fas fa-save"></i>
                                <span>حفظ واعتماد إذن الصرف</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Signatures (Print Only) -->
            <div id="printSignaturesContainer"></div>
        </div>
    </main>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/components/sidebar.js"></script>
    <script src="assets/js/components/header.js"></script>
    <script src="assets/js/components/printLayout.js"></script>
    <script src="assets/js/components/printModal.js"></script>
    <script src="assets/js/components/printSignatures.js"></script>
    <script src="assets/js/components/printReport.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/dispense.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            PrintSignatures.render('#printSignaturesContainer', ['المستلم', 'أمين المخزن', 'المدير']);
        });
    </script>
</body>
</html>
