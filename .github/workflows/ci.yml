name: CI — Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch (keeps the latest only)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write   # required to delete stale artifacts before upload
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
            artifact_name: ci-windows-installer
            artifact_path: dist/*.exe
          - os: ubuntu-latest
            build_script: build:linux
            artifact_name: ci-linux-appimage
            artifact_path: dist/*.AppImage

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.os }}

    steps:
      # ——— 1. Checkout source ———
      - name: Checkout repository
        uses: actions/checkout@v4

      # ——— 2. Setup Node.js ———
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ——— 3. Install dependencies ———
      - name: Install dependencies
        run: npm ci

      # ——— 4. Rebuild native addons for Electron ———
      - name: Rebuild native addons (better-sqlite3)
        run: npx @electron/rebuild

      # ——— 5. Build the application ———
      - name: Build application
        run: npm run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ——— 6. Prune old CI artifacts to avoid hitting storage quota ———
      # CI artifacts are prefixed with "ci-" so they never overlap with release artifacts.
      # Also remove legacy non-prefixed CI artifacts (>2h old) until they expire naturally.
      - name: Delete previous CI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Delete all new ci-prefixed artifacts from previous runs
          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            -q ".artifacts[] | select(.name | startswith(\"ci-\")) | .id" | \
          while read -r id; do
            [ -n "$id" ] && gh api "repos/${{ github.repository }}/actions/artifacts/${id}" -X DELETE || true
          done

          # Delete legacy non-prefixed CI artifacts older than 2 hours
          cutoff=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            -q ".artifacts[] | select((.name == \"windows-installer\" or .name == \"linux-appimage\") and .created_at < \"$cutoff\") | .id" | \
          while read -r id; do
            [ -n "$id" ] && gh api "repos/${{ github.repository }}/actions/artifacts/${id}" -X DELETE || true
          done

      # ——— 7. Upload build artifacts ———
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1
