<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>الموردون - منظومة إدارة المخازن | كلية التقنية الصناعية</title>
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/print.css">
</head>
<body>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="content">

        <!-- Page Title -->
        <div class="header-title-section">
            <h1>إدارة الموردين</h1>
            <p class="subtitle">الشركات والتجار الذين تُورَّد منهم الأصناف</p>
        </div>

        <div class="page-content">
            <!-- Toolbar -->
            <div class="toolbar">
                <button class="btn btn-primary" onclick="openModal()">
                    <span><i class="fas fa-plus"></i></span>
                    <span>إضافة مورد جديد</span>
                </button>
                <div class="toolbar-search">
                    <span class="toolbar-search-icon"><i class="fas fa-search"></i></span>
                    <input type="text" id="supplierSearch" placeholder="بحث بالاسم أو رقم الهاتف..." oninput="filterSuppliers()">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" onclick="printSuppliers()">
                        <span><i class="fas fa-print"></i></span>
                        <span>طباعة</span>
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <div class="table-toolbar">
                    <div class="table-title">قائمة الموردين</div>
                    <div class="table-meta" id="suppliersCount">0 مورد مسجل</div>
                </div>
                <div style="overflow-x: auto;">
                    <table id="suppliersTable">
                        <thead>
                            <tr>
                                <th class="sortable" onclick="sortTable('suppliersTable', 0)">رقم المورد <span class="sort-icon">↕</span></th>
                                <th class="sortable" onclick="sortTable('suppliersTable', 1)">اسم المورد <span class="sort-icon">↕</span></th>
                                <th class="sortable" onclick="sortTable('suppliersTable', 2)">رقم الهاتف <span class="sort-icon">↕</span></th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="suppliersTableBody">
                            <tr><td colspan="4" style="text-align: center; padding: 40px;">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Print Signatures (fixed at page bottom) -->
        <div id="printSignaturesContainer"></div>
    </main>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/components/sidebar.js"></script>
    <script src="assets/js/components/header.js"></script>
    <script src="assets/js/components/printLayout.js"></script>
    <script src="assets/js/components/addEntityModal.js"></script>
    <script src="assets/js/components/printSignatures.js"></script>
    <script src="assets/js/components/layout.js"></script>
    <script src="assets/js/pages/suppliers.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            PrintSignatures.render('#printSignaturesContainer', ['أمين المخزن', 'المدير']);
        });
    </script>
</body>
</html>
