<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الجهات - منظومة إدارة المخازن</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/print.css">
</head>
<body>

    <!-- القائمة الجانبية الموحدة -->
    <div class="sidebar">
        <div class="logo">📦 منظومة المخازن</div>
        <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;"></div>
        <a href="dashboard.html" class="menu-item">📋 إدارة الأصناف</a>
        <a href="supply.html" class="menu-item">📥 أذونات التوريد</a>
        <a href="dispense.html" class="menu-item">📤 أذونات الصرف</a>
        <a href="entities.html" class="menu-item active">👥 الجهات والموردين</a>
        <a href="./report.html" class="menu-item">📊 التقارير والإحصائيات</a>
			  <a href="./settings.html" class="menu-item">⚙️الاعدادات</a>
        <a href="#" class="menu-item" style="color: #28a745;" onclick="handleBackup(event)">💾 نسخة احتياطية</a>
        <a href="#" class="menu-item" style="color: #17a2b8;" onclick="handleRestore(event)">
            📂 استيراد نسخة سابقة
        </a>
        <a href="index.html" class="menu-item" style="margin-top: 50px; background: rgba(220, 53, 69, 0.2); color: #ff6b6b;">🚪 تسجيل الخروج</a>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="content">
        <div class="header">
            <h2>إدارة الجهات والموردين</h2>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="openModal()">
                ➕ إضافة جهة جديدة
            </button>
            <div style="display: flex; gap: 10px; margin-right: auto;">
                <button class="btn" style="background: #28a745; color: white;" onclick="handleDirectPrint()">
                    🖨️ طباعة القائمة
                </button>
                <button class="btn btn-danger" onclick="handlePdfExport()">
                    📄 حفظ كـ PDF
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>رقم الجهة</th>
                        <th>اسم الجهة</th>
                        <th>التصنيف</th>
                        <th>رقم الهاتف</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="entitiesTableBody">
                    <!-- البيانات هنا -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة إضافة جهة (Modal) -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px; color: var(--primary);">إضافة جهة جديدة</h3>
            <form id="addEntityForm">
                <div class="form-group">
                    <label>اسم الجهة (الشركة / القسم / الموظف)</label>
                    <input type="text" id="entityName" required>
                </div>
                <div class="form-group">
                    <label>نوع الجهة</label>
                    <select id="entityType" required>
                        <option value="Supplier">مورد (شركة/تاجر)</option>
                        <option value="Department">قسم (داخل الكلية)</option>
                        <option value="Employee">موظف / عضو هيئة تدريس</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف (اختياري)</label>
                    <input type="text" id="entityPhone" placeholder="09X-XXXXXXX">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">حفظ</button>
                    <button type="button" class="btn" style="flex: 1; background: #ccc;" onclick="closeModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // تحميل الجهات للجدول
        async function loadEntities() {
            const tbody = document.getElementById('entitiesTableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">جاري التحميل...</td></tr>';

            try {
                const entities = await window.api.getAllEntities();
                tbody.innerHTML = '';
                
                if(entities.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد جهات مسجلة بعد</td></tr>';
                    return;
                }

                entities.forEach(ent => {
                    // ترجمة نوع الجهة وإعطاؤها لون مخصص
                    let typeAr = '';
                    let badgeClass = '';
                    if(ent.entity_type === 'Supplier') { typeAr = 'مورد'; badgeClass = 'badge-supplier'; }
                    else if(ent.entity_type === 'Department') { typeAr = 'قسم'; badgeClass = 'badge-dept'; }
                    else { typeAr = 'موظف'; badgeClass = 'badge-emp'; }

                    const phone = ent.phone ? ent.phone : '<span style="color:#aaa;">لا يوجد</span>';

                    tbody.innerHTML += `
                        <tr>
                            <td>${ent.entity_id}</td>
                            <td><strong>${ent.entity_name}</strong></td>
                            <td><span class="badge ${badgeClass}">${typeAr}</span></td>
                            <td dir="ltr" style="text-align:right;">${phone}</td>
                            <td>
                                <button class="btn btn-danger" onclick="deleteEntity(${ent.entity_id})">🗑️ حذف</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">حدث خطأ في الجلب</td></tr>';
            }
        }
        // إضافة جهة جديدة
        document.getElementById('addEntityForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newEntity = {
                name: document.getElementById('entityName').value.trim(),
                type: document.getElementById('entityType').value,
                phone: document.getElementById('entityPhone').value.trim()
            };

            const result = await window.api.addEntity(newEntity);
            if(result.success) {
                closeModal();
                loadEntities(); // إعادة تحديث الجدول
            } else {
                alert('❌ ' + result.message);
            }
        });

        // حذف جهة
        async function deleteEntity(id) {
            if(confirm('هل أنت متأكد من حذف هذه الجهة؟\n(لن تظهر الجهة المحذوفة في فواتير الصرف والتوريد الجديدة)')) {
                const result = await window.api.deleteEntity(id);
                if(result.success) {
                    loadEntities();
                } else {
                    alert('❌ ' + result.message);
                }
            }
        }

        function openModal() {
            document.getElementById('addModal').style.display = 'flex';
            document.getElementById('addEntityForm').reset();
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
        }
        window.addEventListener('DOMContentLoaded', loadEntities);
    </script>
    <script src="assets/js/common.js"></script>
</body>
</html>
