name: Cleanup — Artifact Storage

on:
  workflow_dispatch:
  schedule:
    # Run daily at 03:17 UTC (off-peak)
    - cron: '17 3 * * *'

permissions:
  actions: write   # required to delete artifacts
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    name: Prune old artifacts

    steps:
      - name: Delete all repository artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching artifact list..."
          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            -q '.artifacts[] | [.id, .name, .created_at, .size_in_bytes] | @tsv' | \
          while IFS=$'\t' read -r id name created size; do
            echo "Deleting artifact #$name (id=$id, created=$created, size=$size)"
            gh api "repos/${{ github.repository }}/actions/artifacts/${id}" -X DELETE || true
          done
          echo "Cleanup complete."
