<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منظومة إدارة المخازن | كلية التقنية الصناعية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* عناصر زخرفية في الخلفية */
        .background-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0.1;
            background-image: 
                radial-gradient(circle at 20% 80%, #FF6B00 2px, transparent 2px),
                radial-gradient(circle at 80% 20%, #FF8F00 3px, transparent 3px),
                radial-gradient(circle at 50% 50%, #FF6B00 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px, 60px 60px;
            animation: patternMove 20s linear infinite;
        }

        @keyframes patternMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-20px, 10px) rotate(5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.3),
                0 0 0 2px rgba(255, 107, 0, 0.1);
            width: 100%;
            max-width: 460px;
            padding: 48px 40px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #FF6B00, #FF8F00);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .login-header h1 {
            color: #1a1a2e;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header .subtitle {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .college-name {
            color: #FF6B00;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-align: right;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #FF6B00;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-group input {
            width: 100%;
            padding: 14px 48px 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafafa;
            color: #333;
            text-align: right;
        }

        .form-group input:focus {
            outline: none;
            border-color: #FF6B00;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.1);
        }

        .form-group input:focus + .input-icon,
        .form-group input:focus ~ .input-icon {
            color: #FF8F00;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            accent-color: #FF6B00;
            width: 18px;
            height: 18px;
        }

        .remember-me label {
            color: #555;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .forgot-password {
            color: #FF6B00;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #E55A00;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FF6B00, #FF8F00);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 107, 0, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .system-info {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px solid #f0f0f0;
        }

        .system-info p {
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }

        .system-info .warning {
            color: #FF6B00;
            font-weight: 500;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .error-message {
            background: #FEE2E2;
            border: 1px solid #FCA5A5;
            color: #DC2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: none;
            text-align: right;
            font-size: 14px;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
                margin: 16px;
            }
            
            .login-header h1 {
                font-size: 24px;
            }
            
            .remember-forgot {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20,8H4V6H20V8M20,18H4V12H20V18M20,4H4C2.9,4 2,4.9 2,6V18C2,19.1 2.9,20 4,20H20C21.1,20 22,19.1 22,18V6C22,4.9 21.1,4 20,4Z"/>
                    <path d="M7,15H9V17H7V15M7,9H9V13H7V9M11,13H17V15H11V13M11,9H17V11H11V9Z" fill="white"/>
                </svg>
            </div>
            <h1>نظام إدارة المخازن</h1>
            <p class="subtitle">
                <span class="college-name">كلية التقنية الصناعية</span> - مصراتة
            </p>
        </div>

        <div class="error-message" id="errorMessage">
            ❌ اسم المستخدم أو كلمة المرور غير صحيحة
        </div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="أدخل اسم المستخدم" 
                        required 
                        autocomplete="username"
                    >
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="أدخل كلمة المرور" 
                        required 
                        autocomplete="current-password"
                    >
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>

            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">تذكرني على هذا الجهاز</label>
                </div>
                <a href="#" class="forgot-password" onclick="showForgotPassword()">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="login-btn" id="loginButton">
                تسجيل الدخول
            </button>
        </form>

        <div class="system-info">
            <p>🔒 نظام مخصص للمستخدمين المصرح لهم فقط</p>
            <p class="warning">
                ⚠️ لا يمكن إنشاء حسابات جديدة من هذه الصفحة
            </p>
            <p style="margin-top: 12px; font-size: 12px;">
                للدعم الفني، يرجى التواصل مع قسم تقنية المعلومات
            </p>
        </div>
    </div>

    <script>
        <!-- const authorizedUsers = [ -->
            <!-- { username: 'admin', password: 'cit2024', role: 'مدير النظام' }, -->
            <!-- { username: 'store.manager', password: 'store123', role: 'مدير المخازن' }, -->
            <!-- { username: 'staff1', password: 'staff123', role: 'موظف مخازن' } -->
        <!-- ]; -->
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = document.getElementById('loginButton');
            
            // إخفاء رسالة الخطأ
            errorMessage.style.display = 'none';
            
            if (!username || !password) {
                showError('يرجى إدخال اسم المستخدم وكلمة المرور');
                return false;
            }
            
            // عرض تأثير التحميل
            const originalText = loginButton.innerHTML;
            loginButton.innerHTML = '<span class="loading-spinner"></span> جاري التحقق...';
            loginButton.disabled = true;
            
            try {
                // الاتصال بقاعدة البيانات الحقيقية عبر الجسر
                const result = await window.api.login({ username, password });
                
                if (result.success) {
                    const rememberMe = document.getElementById('remember').checked;
                    
                    // حفظ بيانات الجلسة للاستفادة منها في باقي الصفحات (مثل إظهار اسم المستخدم)
                    const sessionData = {
                        userId: result.user.user_id,
                        username: result.user.full_name,
                        role: result.user.role,
                        rememberMe: rememberMe
                    };
                    
                    localStorage.setItem('userSession', JSON.stringify(sessionData));
                    
                    // توجيه المستخدم إلى لوحة التحكم
                    window.location.href = 'dashboard.html';
                } else {
                    // فشل تسجيل الدخول (البيانات غير مطابقة)
                    showError(result.message);
                    loginButton.innerHTML = originalText;
                    loginButton.disabled = false;
                    
                    // مسح حقل كلمة المرور للسهولة
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (error) {
                showError('حدث خطأ غير متوقع في النظام');
                loginButton.innerHTML = originalText;
                loginButton.disabled = false;
            }
            
            return false;
        }
        
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = '❌ ' + message;
            errorMessage.style.display = 'block';
            
            // إعادة تشغيل أنيميشن الاهتزاز
            errorMessage.style.animation = 'none';
            errorMessage.offsetHeight; // Trigger reflow
            errorMessage.style.animation = 'shake 0.5s ease';
            
            // إخفاء الرسالة بعد 5 ثواني
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }
        
        function showForgotPassword() {
            alert('يرجى التواصل مع مسؤول النظام أو قسم تقنية المعلومات لإعادة تعيين كلمة المرور.\n\nهاتف: 051-XXXXXXX\nبريد إلكتروني: it.support@cit.edu.ly');
        }
        
        // التحقق من وجود جلسة سابقة (إذا تم تفعيل "تذكرني")
        window.addEventListener('DOMContentLoaded', () => {
            const savedSession = localStorage.getItem('userSession');
            if (savedSession) {
                try {
                    const session = JSON.parse(savedSession);
                    if (session.rememberMe) {
                        document.getElementById('username').value = session.username;
                        document.getElementById('remember').checked = true;
                    }
                } catch (e) {
                    localStorage.removeItem('userSession');
                }
            }
            
            // إذا كان في بيئة Electron، تأكد من جاهزية التطبيق
            if (window.electronAPI) {
                window.electronAPI.onReady();
            }
        });
        
        // منع الوصول غير المصرح به (لبيئة Electron)
        document.addEventListener('keydown', function(e) {
            // منع استخدام أدوات المطور في الإنتاج
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                if (window.electronAPI && window.electronAPI.isProduction) {
                    e.preventDefault();
                    return false;
                }
            }
        });
    </script>
</body>
</html>
