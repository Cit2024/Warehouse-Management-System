# ============================================
# INSTRUCTION: Move this file to .github/workflows/ci.yml
# and delete the old ci.yml
# ============================================

name: CI — Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel redundant runs on the same branch (keeps the latest only)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
          - os: ubuntu-latest
            build_script: build:linux

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.os }}

    steps:
      # ——— 1. Checkout source ———
      - name: Checkout repository
        uses: actions/checkout@v4

      # ——— 2. Setup Node.js 22 (upgraded from 20) ———
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ——— 3. Install dependencies ———
      - name: Install dependencies
        run: npm ci

      # ——— 4. Rebuild native addons for Electron ———
      - name: Rebuild native addons (better-sqlite3)
        run: npx @electron/rebuild

      # ——— 5. Build the application ———
      - name: Build application
        run: npm run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: Artifact upload removed to avoid storage quota exhaustion.
      # CI now only validates the build. Release workflow handles artifacts.
