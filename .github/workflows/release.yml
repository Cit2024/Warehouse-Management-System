name: Release — Build & Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare GitHub Release

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          if [[ "${{ github.ref_name }}" == *"-beta"* || "${{ github.ref_name }}" == *"-alpha"* || "${{ github.ref_name }}" == *"-rc"* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "منظومة المخازن ${{ github.ref_name }}" \
              --generate-notes \
              $prerelease_flag

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_script: build:win
            asset_name: windows-installer.exe
            ext: .exe
          - os: ubuntu-latest
            build_script: build:linux
            asset_name: linux-appimage.AppImage
            ext: .AppImage
          - os: ubuntu-latest
            build_script: build:linux-deb
            asset_name: linux-debian.deb
            ext: .deb

    runs-on: ${{ matrix.os }}
    name: Build — ${{ matrix.os }} (${{ matrix.build_script }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libkrb5-dev libsecret-1-dev fakeroot dpkg

      - name: Install dependencies
        run: bun install

      - name: Rebuild native addons (better-sqlite3)
        run: bun run postinstall

      - name: Build application
        run: bun run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage installer
        shell: bash
        run: |
          mkdir -p release-assets
          cp release/*${{ matrix.ext }} "release-assets/${{ matrix.asset_name }}"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            release-assets/* \
            --clobber
